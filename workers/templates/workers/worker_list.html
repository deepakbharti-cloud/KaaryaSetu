{% extends 'base.html' %}
{% block content %}
<h1 class="text-xl font-bold mb-4">Workers</h1>

<form method="get" class="mb-6 flex gap-3">
    <select name="category" class="border p-2 rounded text-sm">
        <option value="">Sabhi Categories</option>
        {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.icon }} {{ cat.name }}</option>
        {% endfor %}
    </select>
    <input type="text" name="area" placeholder="Area" class="border p-2 rounded text-sm">
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-sm">Search</button>
</form>

<!-- OLX STYLE CARD GRID -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    {% for worker in workers %}
        {% include 'workers/_worker_card.html' %}
    {% empty %}
        <p class="col-span-4 text-gray-500">Koi worker nahi mila.</p>
    {% endfor %}
</div>
{% endblock %}
