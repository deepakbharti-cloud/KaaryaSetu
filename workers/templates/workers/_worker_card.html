<!-- Reusable OLX-style worker card - worker_list aur home dono yaha se use karte hain -->
<a href="{% url 'worker_detail' worker.id %}"
   class="relative block bg-white border rounded-lg overflow-hidden hover:shadow-lg transition">

    <div class="h-32 bg-blue-100 flex items-center justify-center text-4xl font-bold text-blue-500">
        {{ worker.user.username|first|upper }}
    </div>

    <span class="absolute top-2 right-2 bg-white rounded-full w-7 h-7 flex items-center justify-center shadow text-sm">🤍</span>

    <div class="p-3">
        <p class="text-lg font-bold text-gray-900">₹{{ worker.hourly_rate }}<span class="text-xs font-normal text-gray-500">/hr</span></p>
        <p class="text-sm text-gray-700 truncate">{{ worker.user.username }} · {{ worker.category }}</p>
        <div class="flex justify-between items-center text-xs text-gray-500 mt-2">
            <span class="truncate">{{ worker.area }}</span>
            <span>⭐ {{ worker.avg_rating }}</span>
        </div>
    </div>
</a>
