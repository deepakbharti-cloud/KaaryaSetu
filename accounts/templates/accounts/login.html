{% extends 'base.html' %}
{% block content %}

<div class="max-w-sm mx-auto bg-white border rounded-xl shadow-sm p-6 mt-4">

    <div class="text-center mb-5">
        <div class="text-5xl mb-2">🛠️</div>
        <h1 class="text-lg font-bold text-gray-900">KaaryaSetu,Welcome to you</h1>
        <p class="text-sm text-gray-500">Connect with trusted workers in your area</p>
    </div>

    <!-- login Via Google-->
    <a href="{% url 'google_login' %}"
       class="flex items-center justify-center gap-3 border rounded-md py-2.5 text-sm font-semibold hover:bg-gray-50">
        <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/>
            <path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        Continue with Google
    </a>

    <div class="flex items-center gap-3 my-4 text-xs text-gray-400">
        <hr class="flex-1"> OR <hr class="flex-1">
    </div>

    <!-- login your self: username / email / phone + password -->
    <form method="post" class="space-y-3">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username, Email ya Phone number"
               class="border border-gray-300 p-2.5 w-full rounded-md text-sm" required>
        <input type="password" name="password" placeholder="Password"
               class="border border-gray-300 p-2.5 w-full rounded-md text-sm" required>
        <button type="submit" class="w-full bg-blue-700 text-white font-semibold py-2.5 rounded-md hover:bg-blue-800">
            Login
        </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-5">
        create a new account?
        <a href="{% url 'register' %}" class="text-blue-700 font-semibold underline">Register karo</a>
    </p>

    <p class="text-center text-xs text-gray-400 mt-4">
       your all details are safe withhh us
    </p>
</div>

{% endblock %}
